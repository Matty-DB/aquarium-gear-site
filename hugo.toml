# Source: https://gohugo.io/getting-started/configuration/
# and https://github.com/adityatelange/hugo-PaperMod/wiki/Installation
baseURL = "https://aquapicked.com/"
languageCode = "en-au"
title = "AquaPicked"
theme = "PaperMod"

enableRobotsTXT = true
buildFuture = false
buildDrafts = false

[services.googleAnalytics]
  ID = "G-MVDRS5G1QC"

[minify]
  disableXML = false

[params]
  env = "production"
  description = "Expert aquarium equipment reviews and comparisons for freshwater and marine fishkeepers."
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = true
  ShowShareButtons = false
  ShowCodeCopyButtons = false

[params.homeInfoParams]
  Title = "Find the Right Gear. Skip the Guesswork."
  Content = "Expert-researched aquarium equipment reviews for Australian fishkeepers."

[params.label]
  text = "AquaPicked"

[params.assets]
  favicon = "/favicon.svg"
  favicon16x16 = "/favicon.svg"
  favicon32x32 = "/favicon.svg"

[taxonomies]
  category = "categories"
  tag = "tags"

[[menu.main]]
  name = "Reviews"
  url = "/categories/"
  weight = 10

[[menu.footer]]
  name = "Privacy Policy"
  url = "/privacy/"
  weight = 10

[[menu.footer]]
  name = "About"
  url = "/about/"
  weight = 20
